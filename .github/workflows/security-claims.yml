name: Security claim integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the claim git_ref reachability check can resolve
          # the referenced commit (OPLANE_REQ-00005008).
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: vgw/go.sum
      - name: Verify claim digests, binding drift and git-ref reachability
        working-directory: vgw
        run: go test -count=1 -timeout=60s ./security/...
