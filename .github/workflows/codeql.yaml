name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "21 19 * * 4"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: vgw/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Extended includes the default security suite plus lower-precision
          # queries. Findings are candidates for triage, not confirmed bugs.
          queries: security-extended

      - name: Build VGW Go module for extraction
        if: matrix.language == 'go'
        shell: bash
        working-directory: vgw
        env:
          CGO_ENABLED: 0
          # setup-go restores the normal build cache before CodeQL starts.
          # An empty, job-local cache ensures the extractor observes compilation.
          GOCACHE: ${{ runner.temp }}/codeql-go-build-cache
        run: go build -a ./...

      - name: Build browser regression Go module for extraction
        if: matrix.language == 'go'
        shell: bash
        working-directory: vgw/regression/browser_ari/default
        env:
          CGO_ENABLED: 0
          GOCACHE: ${{ runner.temp }}/codeql-go-build-cache
        run: go build -a -o "${RUNNER_TEMP}/vgw-regression-internal-default" .

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
