name: VGW browser softphone

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  browser-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vgw/softphone/package-lock.json
      - name: Build browser-only SIP.js bundle from lockfile
        working-directory: vgw/softphone
        run: npm ci --no-audit --no-fund && npm run build
      - name: Exercise page policies and both browser cases
        working-directory: vgw/softphone
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome
          SOFTPHONE_REQUIRE_BROWSER: '1'
        run: npm test
      - name: Check opt-in real-Asterisk browser fixture without launching it
        working-directory: vgw/softphone
        run: node --check test/regression-ari-once.mjs && node test/regression-ari-once.mjs
