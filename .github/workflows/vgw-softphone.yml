name: VGW browser softphone

on:
  push:
    paths:
      - 'vgw/softphone/**'
      - '.github/workflows/vgw-softphone.yml'
  pull_request:
    paths:
      - 'vgw/softphone/**'
      - '.github/workflows/vgw-softphone.yml'

permissions:
  contents: read

jobs:
  browser-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vgw/softphone/package-lock.json
      - name: Build browser-only SIP.js bundle from lockfile
        working-directory: vgw/softphone
        run: npm ci --no-audit --no-fund && npm run build
      - name: Exercise page policies
        working-directory: vgw/softphone
        run: npm test
