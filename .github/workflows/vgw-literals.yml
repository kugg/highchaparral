name: VGW reviewed deployment literals

on:
  push:
    paths:
      - 'vgw/**'
      - '.github/workflows/vgw-literals.yml'
  pull_request:
    paths:
      - 'vgw/**'
      - '.github/workflows/vgw-literals.yml'

permissions:
  contents: read

jobs:
  literal-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: vgw/go.sum
      - name: Inventory redacted operational literals
        working-directory: vgw
        run: go run ./cmd/literalcheck --list --operational
      - name: Refuse unreviewed or stale deployment literals
        working-directory: vgw
        run: go run ./cmd/literalcheck --check
      - name: Exercise policy bypass and log-redaction tests
        working-directory: vgw
        run: go test -race -count=1 ./internal/literalcheck
