name: VGW standalone Go tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  full-go-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: vgw/go.sum
      - name: Verify module and static analysis
        working-directory: vgw
        run: go mod verify && go vet ./...
      - name: Exercise complete standalone module (including Ansible contract)
        working-directory: vgw
        run: go test -race -count=1 -timeout=120s ./...
      - name: Detect intermittent synthetic loopback INVITE failures (JER-23)
        working-directory: vgw
        run: go test -race -count=200 -timeout=120s -run '^TestNormalCallAndBye$' ./internal/calls
