name: VGW standalone Go tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  full-go-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: vgw/go.sum
      - name: Verify module and static analysis
        working-directory: vgw
        run: go mod verify && go vet ./...
      - name: Exercise complete standalone module (including Ansible contract)
        working-directory: vgw
        run: go test -race -count=1 -timeout=120s ./...
      - name: Check isolated browser ARI regression source without Docker
        working-directory: vgw
        run: |
          python3 -B -m unittest discover -s regression/browser_ari -p 'test_*.py'
          python3 -B regression/browser_ari/runner.py
      - name: Verify source-only delivery/attestation gates without QEMU or Noll
        working-directory: vgw
        run: |
          python3 -B -m unittest discover -s deploy/pipeline -p 'test_*.py'
          python3 -B deploy/pipeline/release.py
          python3 -B deploy/pipeline/qemu_stage.py
          python3 -B deploy/pipeline/promote.py
      - name: Check guest-only internal-network helper on Linux
        working-directory: vgw/regression/browser_ari/default
        run: go test ./... && go vet ./...
      - name: Detect intermittent synthetic loopback INVITE failures (JER-23)
        working-directory: vgw
        run: go test -race -count=200 -timeout=120s -run '^TestNormalCallAndBye$' ./internal/calls
