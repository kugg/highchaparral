name: Dependency vulnerability audit

# Security gate for every dependency ecosystem. Runs on every PR (so
# Dependabot update PRs are gated), on main, and daily so a CVE disclosed
# against an already-pinned version is caught even with no code change.
#
# This workflow only READS; it never writes or merges. A non-zero exit on
# any job blocks the PR. Thresholds: govulncheck fails on any reachable
# Go vuln; npm audit fails on high/critical; pip-audit fails on any
# advisory in the resolved requirements.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            vgw/go.sum
            tools/go.sum
      - name: Install pinned govulncheck (version tracked in tools/go.mod)
        working-directory: tools
        run: go install golang.org/x/vuln/cmd/govulncheck
      - name: Audit reachable Go vulnerabilities
        working-directory: vgw
        run: govulncheck ./...

  npm-audit:
    name: npm (softphone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vgw/softphone/package-lock.json
      - name: Audit lockfile (fail on high/critical)
        working-directory: vgw/softphone
        run: npm audit --audit-level=high

  pip-audit:
    name: Python (Flask fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned pip-audit
        run: python -m pip install pip==26.3 pip-audit==2.10.1
      - name: Audit requirements.txt
        run: pip-audit -r requirements.txt
